<h1 id="l01-排错">L01 排错</h1>
<ul><li><code>No module named torch</code>：未按该项目 wheelhouse 安装；本轮未装。</li><li>loss 不降：语料太短已在 train.py 中重复 20 次；仍可能过拟合，属预期。</li><li>生成乱码：字符级、步数少，<strong>不是</strong>失败的唯一标志。</li><li>不要把本模型说成 GPT 官方实现。<code>nn.TransformerEncoder</code> 是 PyTorch API，带因果 mask 的解码器近似。</li></ul>
